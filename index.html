<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Every great business starts with a problem. Explore 20 real world dilemmas across Product, Price, Place, Promotion and People, and discover which founder’s instincts you share.">
    <title>Mind Your Five Ps: Which Founder Are You?</title>
    <link rel="stylesheet" href="styles.css?v=what-do-you-do-31">
  </head>
  <body>
    <div id="app"></div>
    <script src="quiz-data.js?v=what-do-you-do-31"></script>
    <script src="app.js?v=what-do-you-do-31"></script>
    <script>
      (function () {
        const addExtraContextToWrongAnswers = () => {
          const appNode = document.getElementById("app");
          const question = typeof state !== "undefined" && questions && state.currentIndex !== undefined ? questions[state.currentIndex] : null;
          if (!appNode || !question) return;

          appNode.querySelectorAll(".option").forEach((option) => {
            const input = option.querySelector("input");
            const text = option.querySelector("span");
            if (!input || !text) return;

            if (input.value === question.answer) return;
            if (text.dataset.lengthAdjusted === "true") return;

            const baseText = text.textContent.trim();
            text.dataset.originalText = baseText;
            text.textContent = `${baseText} for now, at least`;
            text.dataset.lengthAdjusted = "true";
          });
        };

        const observer = new MutationObserver(() => addExtraContextToWrongAnswers());
        const appNode = document.getElementById("app");
        if (appNode) {
          observer.observe(appNode, { childList: true, subtree: true });
        }
        addExtraContextToWrongAnswers();
      })();
    </script>
  </body>
</html>
