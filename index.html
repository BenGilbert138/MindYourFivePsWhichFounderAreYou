<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Every great business starts with a problem. Explore 20 real world dilemmas across Product, Price, Place, Promotion and People, and discover which founder’s instincts you share.">
    <title>Mind Your Five Ps: Which Founder Are You?</title>
    <link rel="stylesheet" href="styles.css?v=what-do-you-do-31">
  </head>
  <body>
    <div id="app"></div>
    <script src="quiz-data.js?v=what-do-you-do-31"></script>
    <script src="app.js?v=what-do-you-do-31"></script>
    <script>
      const distractorElaborations = {
        Product: "while avoiding further product changes.",
        Price: "while keeping the current pricing approach.",
        Place: "while relying on existing sales channels.",
        Promotion: "while sticking with familiar promotion methods.",
        People: "while keeping the current team structure."
      };
      const appElement = document.getElementById("app");
      const expandDistractors = () => {
        const question = questions[state.currentIndex];
        if (!question) return;

        appElement.querySelectorAll(".option").forEach((option) => {
          const input = option.querySelector("input");
          const label = option.querySelector("span");
          if (input && label && input.value !== question.answer && !label.dataset.expanded) {
            label.textContent += ` ${distractorElaborations[question.category]}`;
            label.dataset.expanded = "true";
          }
        });
      };
      new MutationObserver(expandDistractors).observe(appElement, { childList: true, subtree: true });
    </script>
  </body>
</html>
